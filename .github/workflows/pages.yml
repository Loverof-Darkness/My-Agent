name: Deploy MyAgent-Coder GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Validate bootstrap
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile colab_init.py bootstrap.py drive_runtime/start.py drive_runtime/model_recovery.py

      - name: Build static Pages site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site

          cp colab_init.py _site/colab_init.py
          mkdir -p _site/drive_runtime
          cp drive_runtime/start.py _site/drive_runtime/start.py
          cp drive_runtime/model_recovery.py _site/drive_runtime/model_recovery.py

          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <title>MyAgent-Coder</title>
          </head>
          <body>
            <h1>MyAgent-Coder</h1>
            <p>Google Colab bootstrap:
              <a href="./colab_init.py">colab_init.py</a>
            </p>
          </body>
          </html>
          HTML

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
